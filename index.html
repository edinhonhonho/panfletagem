<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Panfletagem</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="vendor/leaflet.min.css">
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#2a1a15;--paper-dim:#7a6a5c;
    --oxblood:#f6f1ea;--oxblood-2:#efe7db;--panel:#ffffff;--panel-edge:#d8c6ae;
    --red:#d61f1f;--red-bright:#ff4b3e;--red-deep:#8f1010;
    --wheat:#9c6b0c;--wheat-dim:#7a5416;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--oxblood);color:var(--paper);overflow:hidden;-webkit-tap-highlight-color:transparent}

  header{position:fixed;top:0;left:0;right:0;z-index:1200;display:flex;align-items:center;gap:12px;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 44px;
    background:linear-gradient(180deg,rgba(246,241,234,.75),rgba(246,241,234,.5) 60%,rgba(246,241,234,0));pointer-events:none}
  header .star{pointer-events:auto;width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 0 0 2px var(--wheat),0 4px 14px rgba(0,0,0,.15)}
  header .titles{pointer-events:auto;line-height:1}
  header h1{font-family:"Oswald",sans-serif;font-weight:700;font-size:19px;letter-spacing:.5px;margin:0;color:var(--paper)}
  header h1 b{color:var(--red-bright)}
  header .sub{font-size:11px;color:var(--paper-dim);margin-top:3px;letter-spacing:.3px}
  header .kpi{pointer-events:auto;margin-left:auto;font-size:10.5px;color:var(--paper-dim);background:rgba(255,255,255,.6);border:1px solid var(--panel-edge);border-radius:12px;padding:4px 10px;white-space:nowrap;display:none}
  header .kpi b{color:var(--paper);font-weight:600}

  #map{position:absolute;inset:0;background:#eef0ec}
  .leaflet-container{background:#eef0ec;font-family:inherit}
  .leaflet-control-attribution{background:rgba(255,255,255,.75)!important;color:#6b5d50!important;font-size:9px}
  .leaflet-control-attribution a{color:#8a6f56!important}
  .leaflet-bar a{background:var(--panel);color:var(--paper);border-color:var(--panel-edge)!important}
  .leaflet-bar a:hover{background:#f1e7da}
  .landmark-dot{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--red);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.35);border:2px solid #fff}
  .landmark-dot span{transform:rotate(45deg);color:#fff;font-size:16px}



  .locate{position:fixed;z-index:1100;left:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);width:52px;height:52px;border-radius:50%;border:1.5px solid var(--panel-edge);cursor:pointer;background:var(--panel);color:var(--paper);font-size:22px;box-shadow:0 6px 16px rgba(42,26,21,.18)}
  .locate:active{transform:scale(.94)}

  .scrim{position:fixed;inset:0;z-index:1500;background:rgba(20,12,8,.4);display:none;backdrop-filter:blur(2px)}
  .sheet{position:fixed;z-index:1600;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--panel),var(--oxblood-2));border-top:4px solid var(--red);border-radius:16px 16px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.25);padding:14px 16px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(110%);transition:transform .26s cubic-bezier(.2,.8,.2,1);max-height:86vh;overflow:auto}
  .sheet.open{transform:translateY(0)}
  .grab{width:44px;height:4px;background:var(--panel-edge);border-radius:4px;margin:2px auto 12px}
  .sheet h3{font-family:"Oswald",sans-serif;font-weight:700;font-size:20px;margin:0 0 3px;letter-spacing:.5px}
  .evlist{margin:6px 0 4px;border-top:1px solid var(--panel-edge)}
  .ev{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--panel-edge)}
  .ev .tag{font-family:"Oswald",sans-serif;font-weight:700;font-size:11px;letter-spacing:.5px;padding:4px 9px;border-radius:20px;flex:0 0 auto}
  .ev .tag.panfletada{background:var(--red);color:#fff}
  .ev .d{flex:1;font-size:14px}
  .detmeta{display:flex;gap:16px;margin:2px 0 12px;font-size:12px;color:var(--paper-dim)}
  .detmeta b{color:var(--paper);font-family:"Oswald",sans-serif;font-size:15px}

  .toast{position:fixed;z-index:2000;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%) translateY(20px);opacity:0;transition:.25s;background:var(--panel);border:1px solid var(--panel-edge);border-left:4px solid var(--red);color:var(--paper);font-size:13px;padding:11px 16px;border-radius:9px;max-width:88vw;box-shadow:0 8px 24px rgba(0,0,0,.2);pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  #loading{position:fixed;inset:0;z-index:3000;background:var(--oxblood);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  #loading .star{width:60px;height:60px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 0 0 3px var(--wheat);animation:pulse 1.1s ease-in-out infinite}
  #loading p{font-family:"Oswald",sans-serif;letter-spacing:1px;color:var(--paper-dim);font-size:13px}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

  .banner{position:fixed;z-index:1400;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 62px);background:#fdeceb;border:1px solid var(--red-deep);color:#7a1410;border-radius:9px;padding:10px 12px;font-size:12px;display:block}
  .banner b{color:var(--red-deep)}

  @media (min-width:760px){
    header h1{font-size:22px}header .sub{font-size:12px}
    .sheet{left:auto;right:24px;bottom:24px;width:420px;border-radius:16px;border-top:0;border-left:4px solid var(--red);transform:translateX(130%)}
    .sheet.open{transform:translateX(0)}
    .grab{display:none}
  }
</style>
</head>
<body>

<div id="loading"><div class="star">&#9773;</div><p>Carregando&hellip;</p></div>

<header>
  <div class="star">&#9773;</div>
  <div class="titles">
    <h1><b>Panfletagem</b></h1>
    <div class="sub">Humberto Matos</div>
  </div>
  <div class="kpi" id="kpiKm"></div>
</header>

<div id="map"></div>

<div class="banner" id="banner"><b>A marcação de novas panfletagens está desativada.</b> O mapa mostra apenas os registros já feitos.</div>

<button class="locate" id="locate" title="Minha localização">&#9678;</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script src="vendor/leaflet.min.js"></script>
<script src="vendor/maplibre/maplibre-gl.js"></script>
<script src="vendor/maplibre/leaflet-maplibre-gl.js"></script>
<script>
(function(){
  "use strict";

  /* ---------- dados (arquivo estático, somente leitura) ---------- */
  async function loadRows(){ var r=await fetch("data/panfletagens.json"); if(!r.ok) throw new Error(r.status); return r.json(); }

  /* ---------- state ---------- */
  var points=[];
  var map, streetLayer, userMarker=null;

  /* ---------- helpers ---------- */
  function fmt(iso){ if(!iso) return "sem data"; var p=iso.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
  function toast(m){ var t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove("show");},2600); }
  function escapeHtml(s){ return (s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function countDone(p){ return p.eventos.filter(function(e){return e.tipo==="panfletada";}).length; }
  function visible(p){ return p.eventos.length>0; }

  function buildPoints(rws){
    var m={};
    rws.forEach(function(r){
      var k=r.ponto_id;
      if(!m[k]) m[k]={ id:k, ponto_id:k, rua:r.rua, lat:r.lat, lng:r.lng, geom:r.geom||null, eventos:[] };
      m[k].eventos.push({ id:r.id, tipo:r.tipo, data:r.data, pessoa:r.pessoa });
      if(r.rua) m[k].rua=r.rua;
      if(r.geom && !m[k].geom) m[k].geom=r.geom;
    });
    return Object.keys(m).map(function(k){return m[k];});
  }

  async function loadAndRender(){
    try{
      points = buildPoints(await loadRows());
      render();
    }catch(e){
      document.getElementById("banner").innerHTML+=" <b>Não consegui carregar os registros.</b>";
    }
  }

  /* ---------- map ---------- */
  function initMap(){
    map=L.map("map",{zoomControl:false,attributionControl:true,tap:true,preferCanvas:true,minZoom:6,maxZoom:19,maxBounds:[[-34.35,-58.25],[-26.5,-49.1]],maxBoundsViscosity:0.8}).setView([-30.0346,-51.2177],13);
    L.control.zoom({position:"bottomright"}).addTo(map);
    L.maplibreGL({style:"vendor/maplibre/style-light.json"}).addTo(map);
    map.createPane("streetPane"); map.getPane("streetPane").style.zIndex=420;
    streetLayer=L.layerGroup().addTo(map);
    var landmarkIcon=L.divIcon({className:"landmark-pin",html:'<div class="landmark-dot"><span>&#9773;</span></div>',iconSize:[34,34],iconAnchor:[17,34]});
    L.marker([-30.038342866892503,-51.223385800140335],{icon:landmarkIcon,pane:"markerPane"}).addTo(map)
      .bindTooltip("Comitê Central — Rua da República, 359",{direction:"top",offset:[0,-32]});
    fetch("vendor/rs.geojson").then(function(r){return r.json();}).then(function(rs){
      var world=[[85,-180],[85,180],[-85,180],[-85,-180]];
      var holes=rs.geometry.coordinates.map(function(poly){
        return poly[0].map(function(c){return [c[1],c[0]];});
      });
      L.polygon([world].concat(holes),{stroke:false,fillColor:"#f6f1ea",fillOpacity:0.88,interactive:false}).addTo(map);
    }).catch(function(){});
  }

  function doneColor(d){
    var t=Math.min(d,6)/6;
    var light=64-t*32;
    return "hsl(6,85%,"+light+"%)";
  }

  function haversineKm(a,b){
    var R=6371, toRad=Math.PI/180;
    var dLat=(b[0]-a[0])*toRad, dLng=(b[1]-a[1])*toRad;
    var la1=a[0]*toRad, la2=b[0]*toRad;
    var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)*Math.sin(dLng/2);
    return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
  }
  function geomKm(geom){
    var km=0;
    for(var i=1;i<geom.length;i++) km+=haversineKm(geom[i-1],geom[i]);
    return km;
  }

  function render(){
    streetLayer.clearLayers();
    var totalKm=0;
    points.forEach(function(p){
      var d=countDone(p);
      if(d>0 && p.geom && p.geom.length>1) totalKm+=geomKm(p.geom);
    });
    var kpi=document.getElementById("kpiKm");
    if(totalKm>0){ kpi.style.display="block"; kpi.innerHTML="<b>"+totalKm.toFixed(1)+" km</b> panfletados"; }
    else { kpi.style.display="none"; }
    points.filter(visible).forEach(function(p){
      if(!p.geom || p.geom.length<2) return;
      var style={color:doneColor(countDone(p)),weight:5,opacity:0.9,pane:"streetPane"};
      var layer=L.polyline(p.geom,style);
      layer.on("click",function(ev){ L.DomEvent.stopPropagation(ev); openDetail(p.id); });
      streetLayer.addLayer(layer);
    });
  }

  function openDetail(pointId){
    var p=points.find(function(x){return x.id===pointId;});
    if(!p) return;
    var done=countDone(p);
    var evs=p.eventos.slice().sort(function(a,b){ return (b.data||"").localeCompare(a.data||""); });
    var h='<div class="grab"></div><h3>'+escapeHtml(p.rua)+'</h3>';
    h+='<div class="detmeta"><span><b>'+done+'</b> panfletada'+(done===1?"":"s")+'</span></div>';
    h+='<div class="evlist">';
    evs.forEach(function(e){
      h+='<div class="ev"><span class="tag '+e.tipo+'">Feita</span>'
        +'<span class="d">'+fmt(e.data)+'</span></div>';
    });
    h+='</div>';
    openSheet(h);
  }

  /* ---------- controls ---------- */
  function startLocationTracking(){
    if(!navigator.geolocation) return;
    navigator.geolocation.watchPosition(function(pos){
      var ll=[pos.coords.latitude,pos.coords.longitude];
      if(!userMarker){ userMarker=L.circleMarker(ll,{radius:9,color:"#fff",weight:3,fillColor:"#2f8fff",fillOpacity:1,pane:"markerPane"}).addTo(map); }
      else { userMarker.setLatLng(ll); }
    }, function(){}, {enableHighAccuracy:true,maximumAge:5000,timeout:15000});
  }

  document.getElementById("locate").addEventListener("click",function(){
    if(userMarker){ map.setView(userMarker.getLatLng(),16); return; }
    if(!navigator.geolocation){ toast("Localização não suportada."); return; }
    toast("Localizando\u2026");
    navigator.geolocation.getCurrentPosition(function(pos){ map.setView([pos.coords.latitude,pos.coords.longitude],16); },
      function(){ toast("Não consegui a localização."); }, {enableHighAccuracy:true,timeout:8000});
  });

  /* ---------- boot ---------- */
  async function boot(){
    initMap();
    startLocationTracking();
    await loadAndRender();
    document.getElementById("loading").style.display="none";
    setTimeout(function(){ map.invalidateSize(); },200);
  }
  boot();
})();
</script>
</body>
</html>
